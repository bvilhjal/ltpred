site_name: ltpred
site_description: LT-FH++ with family history and family-free ADuLT in Python
site_url: https://bvilhjal.github.io/ltpred/
repo_url: https://github.com/bvilhjal/ltpred
repo_name: bvilhjal/ltpred
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Source Sans 3
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Overview: index.md
  - Tutorial: tutorial.md
  - Choose a method: guide.md
  - Quickstart: quickstart.md
  - Vignette: vignette.md
  - Workflow:
      - Data preparation: data-preparation.md
      - CIP estimation: cip-estimation.md
      - Estimation: estimation.md
      - Inference: inference.md
      - Assumptions & checklist: assumptions.md
  - Reference:
      - Algorithm & model: algorithm.md
      - Research extensions: research.md
      - Technical report: report.md
      - API reference: api.md
  - Project:
      - Roadmap: ROADMAP.md
      - Paper plan: PAPER_PLAN.md
      - Releasing: RELEASING.md
      - Past reviews (historical):
          - v0.3.4 (2026-08): reviews/REVIEW_2026-08.md
          - v0.4.2 (2026-08-28): reviews/REVIEW_2026-09.md
          - v0.5.1 (2026-09-02): reviews/REVIEW_2026-09b.md
          - v0.6.2 (2026-09-10): reviews/REVIEW_2026-09c.md
          - v0.7.0 documentation: reviews/REVIEW_2026-09d.md
          - v0.7.3 efficiency: reviews/REVIEW_2026-09e.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://smartbiomed.dk/
      name: SMARTbiomed
    - icon: fontawesome/brands/github
      link: https://github.com/bvilhjal/ltpred
      name: ltpred on GitHub

copyright: >
  Developed with the support of
  <a href="https://smartbiomed.dk/">SMARTbiomed</a>.

extra_css:
  - stylesheets/smartbiomed.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js
  - javascripts/katex.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            docstring_section_style: list
