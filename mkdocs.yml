site_name: ltpred
site_description: LT-FH++ with family history and family-free ADuLT in Python
repo_url: https://github.com/bvilhjal/ltpred
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Overview: index.md
  - Choose a method: guide.md
  - Quickstart: quickstart.md
  - Workflow:
      - Data preparation: data-preparation.md
      - CIP estimation: cip-estimation.md
      - Estimation: estimation.md
      - Fitting the model: inference.md
      - Assumptions & checklist: assumptions.md
  - Reference:
      - Algorithm & model: algorithm.md
      - Technical report: report.md
      - API reference: api.md
  - Project:
      - Roadmap: ROADMAP.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            docstring_section_style: list
