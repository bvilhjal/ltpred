site_name: ltpred
site_description: LT-FH++ with family history and family-free ADuLT in Python
site_url: https://bvilhjal.github.io/ltpred/
repo_url: https://github.com/bvilhjal/ltpred
repo_name: bvilhjal/ltpred
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Source Sans 3
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# One entry point, one worked tutorial, and references organised by task.
# Historical reviews and maintenance plans stay in the repository, outside search.
exclude_docs: |
  reviews/
  ROADMAP.md
  PAPER_PLAN.md
  RELEASING.md
not_in_nav: |
  guide.md
  vignette.md
  report.md

nav:
  - Overview: index.md
  - Getting started: quickstart.md
  - Tutorial: tutorial.md
  - Work with data:
      - Data preparation: data-preparation.md
      - CIP estimation: cip-estimation.md
      - Scoring: estimation.md
      - Fitting: inference.md
      - Analysis checklist: assumptions.md
  - Reference:
      - Model and algorithms: algorithm.md
      - API reference: api.md
      - Numerical checks: validation.md
      - Research extensions: research.md

validation:
  links:
    anchors: warn

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://smartbiomed.dk/
      name: SMARTbiomed
    - icon: fontawesome/brands/github
      link: https://github.com/bvilhjal/ltpred
      name: ltpred on GitHub

copyright: >
  Developed with the support of
  <a href="https://smartbiomed.dk/">SMARTbiomed</a>.

extra_css:
  - stylesheets/smartbiomed.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js
  - javascripts/katex.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            docstring_section_style: list
