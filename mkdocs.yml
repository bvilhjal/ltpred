site_name: ltpred
site_description: LT-FH++ with family history and family-free ADuLT in Python
repo_url: https://github.com/bvilhjal/ltpred
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Overview: guide.md
  - Quickstart: quickstart.md
  - Data preparation: data-preparation.md
  - Estimation: estimation.md
  - Inference: inference.md
  - Assumptions & checklist: assumptions.md
  - Algorithm & model: algorithm.md
  - API reference: api.md
  - Roadmap: ROADMAP.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            docstring_section_style: list
