# Overrides for a single-trait real-LD genotype set. This is not a complete
# HAPNEST config: copy config.yaml from the HAPNEST repository to
# data/config.yaml and set these keys in it, keeping everything else
# (genotype input paths, rho, Ne, ...) as shipped. Nesting follows HAPNEST's
# config.yaml.
#
# Only the genotypes are used by bench_gwas_power.py --plink. The phenotype is
# simulated by the benchmark under the liability-threshold model, so
# `generate_pheno` and the phenotype_data block are not needed.

global_parameters:
  chromosome: 22          # one chromosome keeps the benchmark tractable
  superpopulation: EUR    # single ancestry keeps the LD reference simple
  random_seed: 42

filepaths:
  general:
    output_dir: data/output
    output_prefix: synthetic_chr-{chromosome}   # HAPNEST requires the wildcard

genotype_data:
  samples:
    use_default: true
    default:
      # bench_gwas_power.py uses the first --n-fam samples as probands.
      nsamples: 12000
