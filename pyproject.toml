[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ltpred"
dynamic = ["version"]                # single-sourced from ltpred.__version__
description = "LT-FH, LT-FH++, ADuLT and PA-FGRS genetic-liability estimation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjarni Vilhjálmsson" }]
keywords = ["genetics", "heritability", "liability-threshold model", "LT-FH",
            "LT-FH++", "ADuLT", "PA-FGRS", "GWAS", "family history", "biobank"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # no "License ::" classifier: PEP 639 forbids one alongside `license = "MIT"`
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# NumPy and SciPy are required runtime dependencies; SciPy supplies the
# vectorised normal CDF/PPF used by the helpers.
dependencies = ["numpy>=1.20", "scipy>=1.6"]

[project.urls]
Homepage = "https://github.com/bvilhjal/ltpred"
Repository = "https://github.com/bvilhjal/ltpred"
Issues = "https://github.com/bvilhjal/ltpred/issues"

[project.optional-dependencies]
fast = ["numba>=0.59"]          # JIT-compiled truncated-MVN Gibbs sweep (recommended)
test = ["pytest>=7"]
lint = ["ruff>=0.5"]            # pyflakes-style lint gate (see [tool.ruff])
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=0.24"]   # `mkdocs serve` / `mkdocs build`

[tool.setuptools]
packages = ["ltpred"]

[tool.setuptools.dynamic]
version = { attr = "ltpred.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests", "research"]
pythonpath = ["."]
markers = [
    # Correct without Numba, but sampling-dominated: ~100x slower on the
    # pure-Python fallback, so the no-JIT CI job deselects these with
    # `-m "not jit_required"`. Everything unmarked -- including the whole
    # truncated-moment/quantile kernel, the PA sweep and the small-n_sim
    # batched-accumulator identities -- still runs there.
    "jit_required: too sampling-heavy to run without the Numba JIT",
]

[tool.ruff]
# Lint for real defects, not style: like ldpred3/bipred, the codebase uses compact
# multi-statement lines (E702) and long lines, so enforce only pyflakes (F).
target-version = "py39"

[tool.ruff.lint]
select = ["F"]
