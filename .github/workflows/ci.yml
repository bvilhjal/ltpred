name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # `fast` extra installed: the JIT-compiled path. Kept on both ends of the
    # supported range plus macOS, because Numba's threading layer and `prange`
    # scheduling are the most platform-sensitive part of the package. The 3.14t
    # leg covers the free-threaded interpreter the benchmarks run on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with the JIT + test extras)
        run: pip install -e ".[fast,test]"
      - name: Core tests
        run: pytest -q tests

  research:
    # Checkout-only research code is unsupported by the package compatibility
    # matrix.  Exercise it once on the current Linux stack without multiplying
    # its cost across every supported Python/platform combination.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with the JIT + test extras)
        run: pip install -e ".[fast,test]"
      - name: Research tests
        run: pytest -q research

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint dependency
        run: pip install -e ".[lint]"
      - name: Lint (pyflakes gate)
        run: ruff check .

  test-no-numba:
    # Numba is an OPTIONAL extra, so a plain `pip install ltpred` runs the pure
    # Python fallback in ltpred/_numba.py -- the path most users get, and the
    # one that promises identical numbers. It is ~100x slower than the JIT, so
    # run the files that exercise the compiled kernels themselves (truncated
    # moments and quantiles, the PA sweep, the batched accumulators, the Gibbs
    # sweep) rather than the sampling-dominated statistical suite, and deselect
    # the handful of large-n_sim comparisons inside them. That is ~300 tests in
    # a few seconds; the JIT-marked ones are covered by the `test` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install WITHOUT the fast extra
        run: pip install -e ".[test]"
      - name: Assert the fallback is really in use
        run: python -c "from ltpred._numba import HAVE_NUMBA; assert not HAVE_NUMBA, 'numba leaked into the no-JIT job'"
      - name: Kernel tests on the pure-Python fallback
        run: |
          pytest -q -m "not jit_required" \
            tests/test_mathfun.py tests/test_thresholds.py \
            tests/test_covariance.py tests/test_public_api.py \
            tests/test_liability_scale.py tests/test_tetrachoric.py \
            tests/test_numba.py tests/test_pedigree.py tests/test_cip.py \
            tests/test_gibbs.py tests/test_pearson_aitken.py \
            tests/test_batched.py

  oldest-deps:
    # The floors declared in pyproject are a promise; resolve to them so they
    # are tested rather than assumed. The default `test` job always installs the
    # newest NumPy/SciPy. numba>=0.59 needs numpy>=1.22, so this job runs the
    # pure-Python fallback -- use the same kernel-file selection as
    # test-no-numba, because the full sampling suite takes hours without the JIT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install at the declared dependency floor
        run: |
          pip install -e ".[test]"
          pip install --force-reinstall "numpy==1.20.*" "scipy==1.6.*"
          python -c "import numpy, scipy; print(numpy.__version__, scipy.__version__)"
      - name: Assert the fallback is really in use
        run: python -c "from ltpred._numba import HAVE_NUMBA; assert not HAVE_NUMBA, 'numba leaked into the floor job'"
      - name: Kernel tests on the pure-Python fallback
        run: |
          pytest -q -m "not jit_required" \
            tests/test_mathfun.py tests/test_thresholds.py \
            tests/test_covariance.py tests/test_public_api.py \
            tests/test_liability_scale.py tests/test_tetrachoric.py \
            tests/test_numba.py tests/test_pedigree.py tests/test_cip.py \
            tests/test_gibbs.py tests/test_pearson_aitken.py \
            tests/test_batched.py

  examples:
    # examples/*.py are the front door for new users and were previously run by
    # neither the tests nor CI, so they could rot silently. They are small (a
    # few seconds each), so just run them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with the JIT extra)
        run: pip install -e ".[fast]"
      - name: Run every example end to end
        run: |
          for f in examples/*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  build:
    # The test jobs run from the source tree (pythonpath = ["."]); this one
    # verifies the artifact users actually install: build the sdist/wheel,
    # twine-check both, install the wheel and import it away from the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build "twine>=6.1"
          python -m build
          python -m twine check dist/*
      - name: Install from the wheel and smoke-import away from the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && python -c "import ltpred; print(ltpred.__version__)"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: pip install -e ".[docs]"
      # `--strict` leaves link/anchor resolution at INFO, so it exits 0 on a
      # broken cross-reference. This also catches an unmatched code fence, which
      # silently renders following prose -- headings included -- as a code block.
      - name: Build and check documentation (strict, fences, anchors)
        run: python scripts/check_docs.py
